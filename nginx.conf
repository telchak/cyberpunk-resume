# Serves the built site (dist/) in the production image. Port 8080, because the image runs
# without root, which may not use ports below 1024. HTTPS is handled in front of it.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Redirects keep the visitor's address (e.g. /cv -> /cv/), not this container's port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Astro puts a hash of their content in these file names, so they can be cached forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Addresses of the previous version of the site.
  location ~ ^/home/?$ {
    return 301 /;
  }
  location ~ ^/(about-me|resume)/?$ {
    return 301 /cv/;
  }
}
